name: 台版公告自動抓取

# PLAN-048 Phase 2：每週自動抓台版官方公告 → 解析 → 寫進 staging 等人工審核。
#
# 為什麼排在這個時間：官方固定週四 05:00（台北）更新，公告通常提前一兩天就上線。
# 週四 01:00 抓，公告必然已經在了；13:00 再補一次，接住偶爾延後發佈的情況。
# 兩次都是冪等的 —— contentHash 沒變就整篇跳過，第二次執行零寫入。
#
# ⚠ 這支排程**不可能弄髒網站**：它只寫 announcementDrafts / pendingActivities
#   兩個 staging 集合，而前台完全不讀它們。要上首頁一定得有人在
#   /admin/announcements 按下合併。自動化的風險上限是「後台多幾筆要忽略的垃圾」。
#
# 為什麼跑在 GitHub Actions 而不是 Worker / Cloud Functions：
#   這支東西未來唯一保證會被改的地方是**解析規則**（官方句型逐年漂移，已實測三次）。
#   跑在這裡，改規則就是「改 scripts/lib/parseAnnouncement.mjs → 跑離線回歸 → push」，
#   排程用的是同一支檔案；另外兩個方案都會產生第二份解析器，而兩份漂開的症狀
#   正是本專案最防的那種：本機 --dry-run 完美、排程跑出來卻不同。

on:
  schedule:
    # cron 是 UTC；台北 = UTC+8
    - cron: '0 17 * * 3'   # 週三 17:00 UTC = 台北 週四 01:00
    - cron: '0 5 * * 4'    # 週四 05:00 UTC = 台北 週四 13:00（補抓）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只解析並印報告，不寫 Firestore'
        type: boolean
        default: false
      backfill:
        description: '回填指定月份（含）之後的公告，格式 YYYY-MM；留空為增量'
        type: string
        default: ''

permissions:
  contents: read

# 兩個排程若因延遲而重疊，後者等前者跑完 —— 同時寫同一批文件沒有意義
concurrency:
  group: scrape-announcements
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # 解析器的離線回歸：改壞規則就不該讓它去寫 Firestore。
      # 只跑解析器那組，秒級，不需要外網也不需要憑證。
      - name: 解析器單元測試
        run: node --test "scripts/**/*.test.mjs"

      # 刻意與 Cloudflare Worker 那把 FIREBASE_SA_KEY 分開命名並分開發放：
      # 排程專用金鑰外洩時可以單獨撤銷，不會連帶弄死本機所有 migrate/scrape 腳本。
      - name: 寫入服務帳號金鑰
        env:
          SA_KEY: ${{ secrets.SCRAPER_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::缺少 secrets.SCRAPER_SA_KEY。請見 PLAN-048 進度表的『上線步驟』。"
            exit 1
          fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"

      - name: 抓取並解析公告
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          ARGS="--fail-on-warn"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.backfill }}" ]; then ARGS="$ARGS --backfill=${{ inputs.backfill }}"; fi
          echo "執行：node scripts/scrape-tw-announcements.mjs $ARGS"
          node scripts/scrape-tw-announcements.mjs $ARGS

      # runner 是拋棄式的，但金鑰不留過任何一秒是免費的
      - name: 清除金鑰
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
