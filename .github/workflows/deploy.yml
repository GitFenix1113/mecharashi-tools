name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          # PLAN-029 Phase 2：公開資料改走 Cloudflare Worker 代理（Worker 網址為公開值、非機密）。
          # 設定此值即啟用 Worker 模式（前端 WORKER_ENABLED）；緊急回退移除本行或設 VITE_USE_WORKER=false。
          # 此時 Firestore 仍 read:if true，直連與 Worker 並存；Phase 3 才收緊規則。
          # PLAN-029 Phase 5 路線 B：/api 已掛進 mecharashi.wiki zone（Workers Route），
          # 改打同源相對路徑 → 免 CORS、隱藏 origin、吃得到 zone 的 Rate Limiting。
          # 回退：改回 https://mecharashi-worker.mecharashi.workers.dev 再 push 即可。
          VITE_WORKER_API_BASE: same-origin

      # ── 清除 gh-pages 上的孤兒 docs ────────────────────────────────────────
      # 下方 deploy 用 keep_files: true（為了保住 preview/ 的 PR 預覽），代價是「只疊加、
      # 不刪除」——被刪掉或搬移過的檔案會永遠留在線上。實測曾累積 1649 個孤兒，其中 36 個
      # 是計畫搬移後殘留的舊 進度表/計畫書：拿著舊連結的人會看到一份「還在執行中」的過時文件。
      #
      # docs/ 沒有雜湊檔名，砍掉重建完全安全（不像 assets/*.js 可能被開著的舊頁面請求），
      # 故只針對它做「先刪除、再由 deploy 重新寫入」。preview/ 與 assets/ 完全不動。
      # 只刪除「線上有、但本次 build 沒有」的孤兒檔案，不動其他任何東西：
      # 既有檔案原地不變（沒有先刪後建的空窗），且多數部署不會有孤兒 → 完全不推額外的 commit。
      - name: Prune stale docs on gh-pages
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages 尚未存在，略過（首次部署）"; exit 0
          fi
          git fetch --depth=1 origin gh-pages
          git worktree add /tmp/ghp FETCH_HEAD
          if [ ! -d /tmp/ghp/docs ]; then
            echo "gh-pages 上沒有 docs/，無需清理"; exit 0
          fi
          # LC_ALL=C 讓兩邊排序規則一致（路徑含中文，locale 不同會導致 comm 誤判）
          ( cd /tmp/ghp && find docs -type f | LC_ALL=C sort ) > /tmp/live.txt
          ( cd dist      && find docs -type f | LC_ALL=C sort ) > /tmp/built.txt
          comm -23 /tmp/live.txt /tmp/built.txt > /tmp/orphans.txt
          count=$(wc -l < /tmp/orphans.txt)
          if [ "$count" -eq 0 ]; then
            echo "✅ 無孤兒檔案，略過"; exit 0
          fi
          echo "發現 $count 個孤兒（線上有、本次 build 沒有），將移除："
          head -20 /tmp/orphans.txt
          cd /tmp/ghp
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' -a /tmp/orphans.txt git rm --quiet --
          git commit -q -m "chore: 移除 gh-pages 上 $count 個已不存在的 docs 檔案"
          git push -q origin HEAD:gh-pages
          echo "✅ 已清除；接著 deploy 步驟照常發布本次 build"

      # ── 清除退役滿寬限期的 assets／images（PLAN-054 D-4 ＋ 2026-10-04 舊 bundle 清理評估）──
      # keep_files: true 的代價是 gh-pages 只疊加、不刪除：repo 刪掉的圖、每次部署換 hash 的舊 bundle
      # 都永遠留在線上（2026-10 實測 assets 258 MB 只有 3 MB 在用、images 有 163 MB 孤兒）。
      # 這一步用 ledger 記錄每個檔案「被新版取代的時間」，退役滿寬限期才刪：
      #   assets 30 天（開著舊分頁的人還要得到舊 chunk；前台另有 vite:preloadError 自動重整）
      #   images 14 天（DB 快照改寫成新路徑之前，舊圖還要撐著）
      # ledger 寫進 dist/，跟著下面的部署一起上去；有要刪的才另外 commit。
      # 第一次執行沒有 ledger → 全部從當天開始倒數，不刪任何東西。
      - name: Prune retired assets/images on gh-pages
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 || { echo "gh-pages 尚未存在，略過"; exit 0; }
          [ -d /tmp/ghp ] || { git fetch --depth=1 origin gh-pages; git worktree add /tmp/ghp FETCH_HEAD; }
          node scripts/prune-gh-pages.mjs --ghp /tmp/ghp --dist dist --dirs assets:30,images:14 \
            --ledger-out dist/.prune-ledger.json --delete-list /tmp/prune.txt
          count=$(grep -c . /tmp/prune.txt || true)
          [ "$count" -gt 0 ] || { echo "✅ 沒有退役滿寬限期的檔案"; exit 0; }
          cd /tmp/ghp
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' -a /tmp/prune.txt git rm --quiet --
          git commit -q -m "chore: 移除 gh-pages 上 $count 個退役滿寬限期的 assets／images 檔案"
          git push -q origin HEAD:gh-pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 刻意保持 true：preview/ 下的 PR 預覽要留著；舊的 assets/*.js 與退場的圖也不在這裡刪，
          # 而是由上面兩步處理（docs/ 立即清、assets／images 退役滿寬限期才清）。
          keep_files: true
          # PLAN-029 Phase 1：自訂網域。每次部署把 CNAME 寫進 gh-pages，GitHub 靠它認 mecharashi.wiki。
          cname: mecharashi.wiki
