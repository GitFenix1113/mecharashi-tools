    <script>
      // Restore the path that 404.html encoded into the query string.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>

    <!-- ── 社群連結預覽 Open Graph（PLAN-038 Tier 1）─────────────────────────────
         Discord / LINE 等平台的預覽爬蟲**不執行 JS**，只解析拿到的原始 HTML，
         所以這些標籤必須寫死在這裡，而不是由 React 掛載後動態塞。
         沒有 og:* 時 Discord 連卡片都不給（LINE 會退而抓 <title> 撐出陽春卡）。

         · og:url / og:image 一律用**絕對網址**——爬蟲讀不到相對路徑。
         · 這是全站共用的預設卡片；機師／機甲／武器詳情頁的逐頁卡片屬 Tier 2，
           由 Cloudflare Worker 在邊緣改寫（尚未實作）。
         · og:image 素材規格與命名慣例見 public/images/og/README.md，
           重產指令：node scripts/generate-og-image.mjs                              -->
